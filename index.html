<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyTrade 1-Click</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f17;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }
        .card {
            background: #151d2a;
            border: 1px solid #233044;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #233044;
        }
        .trader-name { font-size: 15px; color: #38bdf8; font-weight: 700; }
        .badge-sl {
            background: #ef444422;
            color: #ef4444;
            border: 1px solid #ef444455;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .deal-box {
            background: #0b0f17;
            border: 1px solid #233044;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        .row.total {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #233044;
            font-size: 16px;
            color: #ffffff;
            font-weight: bold;
        }
        .val { color: #ffffff; font-weight: 600; }
        .val-highlight { color: #38bdf8; font-weight: 800; font-size: 18px; }
        
        .btn-wallet {
            background: #0500FF;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 10px;
        }
        .btn-trust { background: #0500FF; }
        .btn-metamask { background: #f6851b; }
        .btn-sim {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }
        .fees {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div>
            <div style="font-size: 11px; color: #64748b;">Сигнал трейдера:</div>
            <div class="trader-name" id="trader-alias">Инфлюенсер</div>
        </div>
        <div class="badge-sl" id="sl-badge">SL: -20%</div>
    </div>

    <div class="deal-box">
        <div class="row">
            <span>Токен:</span>
            <span class="val" id="token-name">PEPE</span>
        </div>
        <div class="row">
            <span>Сумма входа:</span>
            <span class="val" id="pay-eth">0.05 ETH</span>
        </div>
        <div class="row total">
            <span>Получаете:</span>
            <span class="val-highlight" id="token-receive">15,000,000 PEPE</span>
        </div>
    </div>

    <!-- КНОПКИ ДЛЯ ОТКРЫТИЯ КОШЕЛЬКОВ НАПРЯМУЮ -->
    <a id="trust-btn" href="#" class="btn-wallet btn-trust" target="_blank">🛡 Оплатить через Trust Wallet</a>
    <a id="metamask-btn" href="#" class="btn-wallet btn-metamask" target="_blank" style="margin-top: 8px;">🦊 Оплатить через MetaMask</a>
    
    <button class="btn-sim" onclick="executeSimulation()">🧪 Тестовая симуляция (без кошелька)</button>

    <div class="fees">🛡 Сплит комиссии 15% трейдеру / 15% платформе</div>
</div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const traderName = urlParams.get('trader') || 'Инфлюенсер';
    const tokenName = urlParams.get('name') || 'PEPE';
    const tokenAddr = urlParams.get('token') || '0x6982508145454Ce325dDbE47a25d4ec3d2311933';
    const sl = urlParams.get('sl') || '20';
    const ethAmount = urlParams.get('eth') || '0.05';
    const tokensAmount = urlParams.get('tokens') || '15,000,000';

    document.getElementById('trader-alias').innerText = traderName;
    document.getElementById('token-name').innerText = tokenName;
    document.getElementById('pay-eth').innerText = `${ethAmount} ETH`;
    document.getElementById('token-receive').innerText = `${tokensAmount} ${tokenName}`;
    document.getElementById('sl-badge').innerText = `SL: -${sl}%`;

    // Генерация прямых Deep-Link ссылок для открытия приложений кошельков на телефоне
    const currentUrl = window.location.href;
    document.getElementById('trust-btn').href = `https://link.trustwallet.com/open_url?coin_id=60&url=${encodeURIComponent(currentUrl)}`;
    document.getElementById('metamask-btn').href = `https://metamask.app.link/dapp/${window.location.host}${window.location.pathname}${window.location.search}`;

    function executeSimulation() {
        alert(`✅ Сделка исполнена!\n\nКуплено: ${tokensAmount} ${tokenName}\nСумма: ${ethAmount} ETH\nStop-Loss: -${sl}%\nКомиссия 15/15 списана.`);
    }
</script>
</body>
</html>
