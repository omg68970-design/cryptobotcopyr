<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyTrade Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f17;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }
        .card {
            background: #151d2a;
            border: 1px solid #233044;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #233044;
        }
        .trader-name { font-size: 15px; color: #38bdf8; font-weight: 700; }
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-buy { background: #22c55e22; color: #22c55e; border: 1px solid #22c55e55; }
        .badge-sell { background: #ef444422; color: #ef4444; border: 1px solid #ef444455; }
        .deal-box {
            background: #0b0f17;
            border: 1px solid #233044;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        .row.total {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #233044;
            font-size: 16px;
            color: #ffffff;
            font-weight: bold;
        }
        .val { color: #ffffff; font-weight: 600; }
        .val-highlight { color: #38bdf8; font-weight: 800; font-size: 18px; }
        .val-profit { color: #4ade80; font-weight: 800; font-size: 18px; }
        
        .btn-action {
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: block;
            text-align: center;
            margin-top: 10px;
        }
        .btn-buy-color { background: #22c55e; box-shadow: 0 4px 15px rgba(34,197,94,0.3); }
        .btn-sell-color { background: #ef4444; box-shadow: 0 4px 15px rgba(239,68,68,0.3); }
        
        .btn-sim {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }
        .fees {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div>
            <div style="font-size: 11px; color: #64748b;">Сигнал трейдера:</div>
            <div class="trader-name" id="trader-alias">Инфлюенсер</div>
        </div>
        <div class="badge" id="action-badge">Загрузка...</div>
    </div>

    <div class="deal-box">
        <div class="row">
            <span>Токен:</span>
            <span class="val" id="token-name">PEPE</span>
        </div>
        <div class="row">
            <span id="amount-label">Сумма:</span>
            <span class="val" id="pay-eth">...</span>
        </div>
        <div class="row total">
            <span id="receive-label">Итог:</span>
            <span id="token-receive" class="val-highlight">...</span>
        </div>
    </div>

    <button id="main-btn" class="btn-action" onclick="openWalletApp()">Загрузка...</button>
    <button class="btn-sim" onclick="executeSimulation()">🧪 Тестовая симуляция (в 1 клик)</button>

    <div class="fees" id="fees-info">🛡 Сплит комиссии 15% трейдеру / 15% платформе</div>
</div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action') || 'BUY';
    const traderName = urlParams.get('trader') || 'Инфлюенсер';
    const tokenName = urlParams.get('name') || 'PEPE';
    const tokenAddr = urlParams.get('token') || '0x6982508145454Ce325dDbE47a25d4ec3d2311933';
    const ethAmount = urlParams.get('eth') || '0.05';
    const tokensAmount = urlParams.get('tokens') || '15,000,000';

    document.getElementById('trader-alias').innerText = traderName;
    document.getElementById('token-name').innerText = tokenName;

    const badge = document.getElementById('action-badge');
    const mainBtn = document.getElementById('main-btn');
    const receiveVal = document.getElementById('token-receive');

    if (action === 'SELL') {
        badge.innerText = "🔴 ПРОДАЖА / ВЫВОД";
        badge.className = "badge badge-sell";
        
        document.getElementById('amount-label').innerText = "Продаем токенов:";
        document.getElementById('pay-eth').innerText = `${tokensAmount} ${tokenName}`;
        
        document.getElementById('receive-label').innerText = "Выплата на кошелек:";
        receiveVal.innerText = `+${ethAmount} ETH`;
        receiveVal.className = "val-profit";

        mainBtn.innerText = `🔴 ВЫВЕСТИ +${ethAmount} ETH НА КОШЕЛЕК`;
        mainBtn.className = "btn-action btn-sell-color";
    } else {
        badge.innerText = "🟢 ПОКУПКА";
        badge.className = "badge badge-buy";
        
        document.getElementById('amount-label').innerText = "Сумма входа:";
        document.getElementById('pay-eth').innerText = `${ethAmount} ETH`;
        
        document.getElementById('receive-label').innerText = "Получаете:";
        receiveVal.innerText = `${tokensAmount} ${tokenName}`;
        receiveVal.className = "val-highlight";

        mainBtn.innerText = `🟢 КУПИТЬ ${tokenName} (Trust Wallet)`;
        mainBtn.className = "btn-action btn-buy-color";
    }

    function openWalletApp() {
        let dexUrl = "";
        if (action === 'SELL') {
            dexUrl = `https://app.uniswap.org/#/swap?inputCurrency=${tokenAddr}&outputCurrency=ETH`;
        } else {
            dexUrl = `https://app.uniswap.org/#/swap?outputCurrency=${tokenAddr}`;
        }

        const trustDeepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=${encodeURIComponent(dexUrl)}`;

        if (tg && tg.openLink) {
            tg.openLink(trustDeepLink);
        } else {
            window.location.href = trustDeepLink;
        }
    }

    function executeSimulation() {
        if (action === 'SELL') {
            alert(`🎉 СРЕДСТВА ВЫВЕДЕНЫ!\n\nПродано: ${tokensAmount} ${tokenName}\nНачислено на кошелек: +${ethAmount} ETH\nКомиссия 15% инфлюенсеру и 15% сервису выплачена.`);
        } else {
            alert(`✅ ПОКУПКА УСПЕШНА!\n\nКуплено: ${tokensAmount} ${tokenName}\nСписано: ${ethAmount} ETH\nStop-Loss активен.`);
        }
        if (tg) tg.close();
    }
</script>
</body>
</html>
