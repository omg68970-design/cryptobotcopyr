<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyTrade 1-Click</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f17;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }
        .card {
            background: #151d2a;
            border: 1px solid #233044;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #233044;
        }
        .trader-name {
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
        }
        .badge-sl {
            background: #ef444422;
            color: #ef4444;
            border: 1px solid #ef444455;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .deal-box {
            background: #0b0f17;
            border: 1px solid #233044;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        .row.total {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #233044;
            font-size: 16px;
            color: #ffffff;
            font-weight: bold;
        }
        .val {
            color: #ffffff;
            font-weight: 600;
        }
        .val-highlight {
            color: #38bdf8;
            font-weight: 800;
            font-size: 18px;
        }
        .btn-buy {
            background: #22c55e;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }
        .btn-buy:active { transform: scale(0.98); }
        .btn-sim {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
        }
        .status {
            text-align: center;
            font-size: 13px;
            margin-top: 12px;
            color: #94a3b8;
        }
        .fees {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div>
            <div style="font-size: 11px; color: #64748b;">Копирование сделки:</div>
            <div class="trader-name" id="trader-alias">Трейдер</div>
        </div>
        <div class="badge-sl" id="sl-badge">SL: -20%</div>
    </div>

    <!-- ВСЕ ДАННЫЕ УЖЕ ПОДСТАВЛЕНЫ -->
    <div class="deal-box">
        <div class="row">
            <span>Покупка токена:</span>
            <span class="val" id="token-name">PEPE</span>
        </div>
        <div class="row">
            <span>Сумма входа:</span>
            <span class="val" id="pay-eth">0.05 ETH</span>
        </div>
        <div class="row total">
            <span>Получаете:</span>
            <span class="val-highlight" id="token-receive">15,000,000 PEPE</span>
        </div>
        <div class="row" style="margin-top: 6px; font-size: 12px;">
            <span>Контракт:</span>
            <span class="val" style="font-family: monospace; color: #64748b;" id="token-addr">0x...</span>
        </div>
    </div>

    <!-- ОДНА КНОПКА ДЕЙСТВИЯ -->
    <button class="btn-buy" id="main-btn" onclick="executeOneClickTrade()">⚡ ПОДТВЕРДИТЬ ПОКУПКУ</button>
    <button class="btn-sim" onclick="executeSimulation()">🧪 Тестовое исполнение (без кошелька)</button>

    <div class="status" id="status-text">Ожидание подтверждения</div>
    <div class="fees">🛡 Сплит комиссии 15% трейдеру / 15% платформе заложен в контракт</div>
</div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // Автоматическое считывание всех параметров из URL
    const urlParams = new URLSearchParams(window.location.search);
    const traderName = urlParams.get('trader') || 'Инфлюенсер';
    const tokenName = urlParams.get('name') || 'PEPE';
    const tokenAddr = urlParams.get('token') || '0x6982508145454Ce325dDbE47a25d4ec3d2311933';
    const sl = urlParams.get('sl') || '20';
    const ethAmount = urlParams.get('eth') || '0.05';
    const tokensAmount = urlParams.get('tokens') || '15,000,000';

    document.getElementById('trader-alias').innerText = traderName;
    document.getElementById('token-name').innerText = tokenName;
    document.getElementById('pay-eth').innerText = `${ethAmount} ETH`;
    document.getElementById('token-receive').innerText = `${tokensAmount} ${tokenName}`;
    document.getElementById('token-addr').innerText = `${tokenAddr.slice(0, 6)}...${tokenAddr.slice(-4)}`;
    document.getElementById('sl-badge').innerText = `SL: -${sl}%`;

    // 1. Исполнение в 1 клик через Web3
    async function executeOneClickTrade() {
        const btn = document.getElementById('main-btn');
        const status = document.getElementById('status-text');

        if (!window.ethereum) {
            alert("Web3-кошелек не обнаружен. Нажмите 'Тестовое исполнение' ниже для проверки.");
            return;
        }

        try {
            btn.innerText = "Подтверждение в кошельке...";
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            const signer = provider.getSigner();

            const message = `CopyTrade 1-Click:\nТрейдер: ${traderName}\nПокупка: ${tokensAmount} ${tokenName}\nСумма: ${ethAmount} ETH\nStop-Loss: -${sl}%`;
            await signer.signMessage(message);

            btn.innerText = "✅ КУПЛЕНО!";
            btn.style.background = "#0284c7";
            status.innerHTML = `<span style="color:#4ade80;">Ордер исполнен! Stop-Loss -${sl}% активен.</span>`;
            
            setTimeout(() => { if (tg) tg.close(); }, 1500);
        } catch (e) {
            btn.innerText = "⚡ ПОДТВЕРДИТЬ ПОКУПКУ";
            status.innerText = "❌ Отклонено: " + (e.message || "Ошибка");
        }
    }

    // 2. Симуляция исполнения в 1 клик
    function executeSimulation() {
        const btn = document.getElementById('main-btn');
        const status = document.getElementById('status-text');

        btn.innerText = "Исполнение ордера...";
        status.innerHTML = `<span style="color:#38bdf8;">⏳ Отправка транзакции в пул...</span>`;

        setTimeout(() => {
            btn.innerText = "✅ КУПЛЕНО!";
            btn.style.background = "#0284c7";
            btn.disabled = true;
            status.innerHTML = `<span style="color:#4ade80;">🎉 Успешно куплено ${tokensAmount} ${tokenName}! Stop-Loss -${sl}%.</span>`;
            alert(`✅ Сделка исполнена в 1 клик!\n\nТокен: ${tokensAmount} ${tokenName}\nСумма: ${ethAmount} ETH\nStop-Loss: -${sl}%`);
        }, 800);
    }
</script>
</body>
</html>
